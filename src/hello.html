<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 내일바꿈 3기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #fff4ec;
      --bg2: #eef1ff;
      --card: rgba(255, 255, 255, 0.72);
      --text: #2b2440;
      --muted: #6b6485;
      --accent1: #ff7a8a;
      --accent2: #7b6cff;
      --accent3: #ffb86b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #1d1a2b;
        --bg2: #14172a;
        --card: rgba(40, 36, 60, 0.7);
        --text: #f3efff;
        --muted: #b3abd0;
      }
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: "Noto Sans KR", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow: hidden;
    }

    /* 배경에 떠다니는 동그라미 */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      animation: float 12s ease-in-out infinite alternate;
      z-index: 0;
    }
    .blob.a { width: 320px; height: 320px; background: var(--accent1); top: -80px; left: -60px; }
    .blob.b { width: 280px; height: 280px; background: var(--accent2); bottom: -70px; right: -50px; animation-delay: -4s; }
    .blob.c { width: 200px; height: 200px; background: var(--accent3); top: 55%; left: 60%; animation-delay: -8s; }

    @keyframes float {
      to { transform: translate(40px, -30px) scale(1.1); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(640px, 100%);
      padding: 56px 40px;
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 28px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(60, 40, 120, 0.15);
      animation: rise 0.9s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
    }

    .wave {
      font-size: 56px;
      display: inline-block;
      transform-origin: 70% 70%;
      animation: wave 2.4s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0); }
      10%, 30% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }

    .hello {
      margin-top: 16px;
      font-family: "Gowun Dodum", sans-serif;
      font-size: clamp(22px, 5vw, 30px);
      color: var(--muted);
    }

    .title {
      margin-top: 12px;
      font-size: clamp(30px, 8vw, 52px);
      font-weight: 900;
      line-height: 1.25;
      background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3), var(--accent1));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine {
      to { background-position: 300% 0; }
    }

    .badge {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      box-shadow: 0 8px 20px rgba(123, 108, 255, 0.35);
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="blob c"></div>

  <main class="card">
    <div class="wave">👋</div>
    <p class="hello">안녕하세요, 이수은입니다.</p>
    <h1 class="title">AI 내일바꿈 3기<br>시작!</h1>
    <span class="badge">✨ 함께 내일을 바꿔요</span>
  </main>
</body>
</html>
